name: Playwright Tests

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      CI: "true"

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Configurar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Dar permiso a Gradle Wrapper
        run: chmod +x gradlew

      - name: Instalar Chromium y dependencias
        run: ./gradlew playwright --args="install --with-deps chromium"

      - name: Ejecutar pruebas
        run: ./gradlew test

      - name: Subir trazas y capturas
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts
          path: build/artifacts/
          if-no-files-found: warn
          retention-days: 7